name: Contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Offline contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run offline contract suite
        run: npm test
